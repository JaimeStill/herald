[tasks.dev]
description = "Run the full dev loop: Go server (air live-reload) + web client (bun watch)"
run = '''
set -e
trap 'kill 0' EXIT INT TERM
(cd app && bun run watch) &
air &
wait
'''

[tasks."dev:auth"]
description = "Run the full dev loop with HERALD_ENV=auth (Entra auth overlay)"
env = { HERALD_ENV = "auth" }
run = '''
set -e
trap 'kill 0' EXIT INT TERM
(cd app && bun run watch) &
air &
wait
'''

[tasks."dev:stop"]
description = "Stop air, the bun web watcher, and the air-built server for any running dev loop"
run = '''
pkill -x air || true
pkill -f 'scripts/watch.ts' || true
pkill -f 'bin/server' || true
true
'''

[tasks."stack:up"]
description = "Start the Docker stack (Postgres + Azurite) and apply migrations"
run = '''
set -e
docker compose up -d --wait
go run ./cmd/migrate -up
'''

[tasks."stack:down"]
description = "Stop the Docker stack"
run = "docker compose down"

[tasks."stack:reset"]
description = "Purge the Docker stack (containers, volumes, networks, images, orphans)"
run = "docker compose down -v --rmi all --remove-orphans"

[tasks.build]
description = "Build the server binary"
run = "go build -o bin/server ./cmd/server"

[tasks.test]
description = "Run all tests"
run = "go test ./tests/..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks."migrate:up"]
description = "Run all up migrations"
run = "go run ./cmd/migrate -up"

[tasks."migrate:down"]
description = "Run all down migrations"
run = "go run ./cmd/migrate -down"

[tasks."migrate:version"]
description = "Print current migration version"
run = "go run ./cmd/migrate -version"

[tasks."web:fmt"]
description = "Format web client source files"
run = "cd app && bunx prettier --write client/"

[tasks."web:build"]
description = "Build the web client"
run = "cd app && bun run build"

[tasks."web:watch"]
description = "Watch and rebuild the web client"
run = "cd app && bun run watch"
