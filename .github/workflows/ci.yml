name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2

      # The app/pkg-web packages go:embed the built web client (app/dist),
      # which is gitignored — build it so the Go toolchain can compile.
      - name: Build web client
        run: |
          cd app
          bun install --frozen-lockfile
          bun run build

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./tests/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2

      - name: Build web client
        run: |
          cd app
          bun install --frozen-lockfile
          bun run build

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
